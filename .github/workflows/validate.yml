name: Validate

# Push runs are limited to main: every other branch gets validated through its
# pull_request events, so a bare `push` trigger would run everything twice per
# PR commit.
on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shell's `*` does not cross directory separators (git's does), so the
      # sourced libraries under hooks/lib/ need their own pattern here — without
      # it they would go unlinted while still running inside every guard.
      - name: Lint hook & script shell files
        run: shellcheck plugins/*/hooks/*.sh plugins/*/hooks/lib/*.sh plugins/*/tests/*.sh scripts/*.sh tests/hooks/*.sh tests/scenarios/*.sh tests/scenarios/mocks/*.sh tests/fixtures/*.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plugin manifest & structure
        run: scripts/validate-plugin.sh

  # Diff-based, so it only runs where there is a base branch to diff against —
  # the push-to-main run has nothing to compare and would compare against
  # itself. Its own job rather than a validate-plugin.sh section because that
  # script is deliberately tree-only (it runs locally, mid-branch, with no base).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the target branch has to be reachable; a shallow
          # clone of the PR head alone cannot produce one.
          fetch-depth: 0
      - name: Shipped changes carry release notes
        run: scripts/check-changelog.sh "${{ github.base_ref }}"

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Discovers every plugin's suite (plugins/*/tests/*.test.sh) and fails if a
      # plugin ships hooks with no tests beside them, so a new plugin's guards
      # cannot land untested without this job going red.
      - name: Run hook behavior tests
        run: bash tests/hooks/run.sh

      # LLM-free: proves the adversarial suite's mock git host still speaks MCP
      # and records calls. Cheap enough for every PR, and a silently broken mock
      # would make the S5 scenario pass for the wrong reason when it is run.
      - name: Self-test the adversarial suite's mock git host
        run: bash tests/scenarios/mocks/selftest.sh

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node ships on the runner, so no setup-node step: this only needs npm to
      # unpack the pinned Biome binary named in package-lock.json.
      - name: Install the pinned Biome
        run: npm ci
      # `ci` is read-only — it reports and exits non-zero, and never rewrites a
      # file. Use `npm run lint:fix` locally to apply fixes, as a reviewable diff.
      - name: Lint the web assets and repo JavaScript
        run: npx biome ci .
